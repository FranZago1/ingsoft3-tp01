services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: padel
      POSTGRES_PASSWORD: padel
      POSTGRES_DB: padel
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U padel -d padel"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    environment:
      # La app apunta al servicio `db` de esta red de Docker.
      DATABASE_URL: "postgresql://padel:padel@db:5432/padel?schema=public"
      JWT_SECRET: "secret-de-desarrollo-cambiar-en-prod"
      NODE_ENV: "production"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
