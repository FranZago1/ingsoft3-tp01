name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    # Orden: de lo más barato a lo más caro, para fallar cuanto antes.
    # lint (segundos) → typecheck (segundos) → build → imágenes Docker (minutos).
    env:
      # Valores dummy: ningún paso necesita una base real, pero las variables
      # tienen que existir para que Prisma y el build no exploten.
      DATABASE_URL: "postgresql://user:pass@localhost:5432/db?schema=public"
      JWT_SECRET: "ci-dummy-secret"
      BACKEND_URL: "http://localhost:8080"

    steps:
      - uses: actions/checkout@v4

      - name: Node 20 con cache de npm
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          # Dos proyectos, dos lockfiles: los dos alimentan la cache.
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # ---------- backend ----------
      - name: backend · npm ci
        working-directory: backend
        run: npm ci

      - name: backend · lint
        working-directory: backend
        run: npm run lint

      - name: backend · typecheck
        working-directory: backend
        run: npm run typecheck

      - name: backend · build (prisma generate + tsc)
        working-directory: backend
        run: npm run build

      # ---------- frontend ----------
      - name: frontend · npm ci
        working-directory: frontend
        run: npm ci

      - name: frontend · lint
        working-directory: frontend
        run: npm run lint

      - name: frontend · typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: frontend · build (next build standalone)
        working-directory: frontend
        run: npm run build

      # ---------- imágenes ----------
      # Se construyen para verificar que los Dockerfile siguen siendo válidos.
      # NO se pushean: publicar en GHCR es un paso manual (ver
      # docker-compose.registry.yml).
      - name: Imagen del backend (sin push)
        run: docker build -t reservapadel-backend:ci ./backend

      - name: Imagen del frontend (sin push)
        run: docker build -t reservapadel-frontend:ci ./frontend

  # TODO TP4/TP5: 8 tests de backend + 4 de frontend, sin base de datos y sin
  # servidor. Por eso las reglas viven en backend/src/services/ (funciones puras
  # que reciben los datos ya consultados) y las validaciones del front en
  # frontend/src/lib/validacion.ts. Cuando existan los tests, descomentar:
