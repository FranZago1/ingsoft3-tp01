name: CI

on:
  pull_request:
    branches: [main]      # ← el que hace el trabajo: verifica ANTES del merge
  push:
    branches: [main]      # ← sólo para que main tenga su corrida (la que lee el badge)

jobs:
  build-backend:
    runs-on: ubuntu-latest
    # TP6: por job y no a nivel del workflow. `permissions:` arriba de todo
    # REEMPLAZA el default de todos los jobs; acá sólo toca al que publica.
    # contents: read no es de más: lo que no se lista queda sin permiso, y sin
    # él el checkout no puede leer el código.
    permissions:
      contents: read
      packages: write
    steps:
      - name: Qué estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA · commit $GITHUB_SHA"

      - name: Bajar el código al runner
        uses: actions/checkout@v6

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4

      # A partir de acá, el TP5: los tests y su cobertura. No es un job nuevo —
      # van adentro de build-backend a propósito, porque ése ya es un required
      # check de main: el freno no hay que volver a configurarlo, se hereda.
      - name: Construir la etapa de tests del backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          target: test              # ← se detiene en la etapa de tests, no llega a runner
          load: true                # ← la baja al Docker local; sin esto el docker run no la encuentra
          push: false
          tags: backend-test:ci
          cache-from: type=gha,scope=backend-test   # su propio estante: son 4 builds distintos
          cache-to: type=gha,mode=max,scope=backend-test

      - name: Correr los tests del backend con coverage
        run: |
          docker run --rm -e COVERAGE_DIR=/salida/reporte \
            -v "${{ github.workspace }}/backend-coverage:/salida" backend-test:ci

      - name: Resumen del coverage del backend
        if: ${{ !cancelled() }}     # ← también si los tests fallaron: es la corrida que se entrega
        run: |
          F=backend-coverage/reporte/coverage-summary.json
          test -f "$F"              # si no está, el paso FALLA: mejor rojo que un resumen vacío
          node -e "
            const t = require('./$F').total;
            if (!t.lines.total) { console.error('midio 0 archivos: revisar el include'); process.exit(1); }
            const f = (m) => \`| \${m} | \${t[m].pct}% | \${t[m].covered}/\${t[m].total} |\`;
            console.log('### Coverage del backend');
            console.log('| métrica | % | cubierto |'); console.log('|---|---|---|');
            console.log(f('lines')); console.log(f('branches')); console.log(f('functions'));
          " >> $GITHUB_STEP_SUMMARY

      - name: Publicar el coverage del backend
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: coverage-backend
          path: backend-coverage

      # ---- TP6: el cierre del CI. Publicar es lo ÚLTIMO del job, a propósito ----
      # No hay ningún `if` que diga «si los tests pasaron»: no hace falta. Los
      # steps corren en orden y se cortan al primer error, así que si el
      # `docker run` de los tests da rojo, estos dos pasos nunca llegan a correr.
      # La condición está en el ORDEN. Y no llevan `!cancelled()` ni `always()`
      # (como los del reporte): eso los haría correr con los tests en rojo.
      - name: Entrar al registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # el token de la corrida: ningún secret nuevo

      - name: Construir y publicar la imagen del backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          # Las dos condiciones, no una: sólo un push a main publica. Si algún
          # día el disparador escucha otra rama, la garantía sigue acá.
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          # En minúsculas y a mano: el registry no acepta mayúsculas y
          # github.repository es «FranZago1/…». La etiqueta es el commit.
          tags: ghcr.io/franzago1/ingsoft3-tp01-backend:sha-${{ github.sha }}
          build-args: APP_COMMIT=${{ github.sha }}   # lo informa /api/health
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-frontend:
    runs-on: ubuntu-latest
    # TP6: por job y no a nivel del workflow. `permissions:` arriba de todo
    # REEMPLAZA el default de todos los jobs; acá sólo toca al que publica.
    # contents: read no es de más: lo que no se lista queda sin permiso, y sin
    # él el checkout no puede leer el código.
    permissions:
      contents: read
      packages: write
    steps:
      - name: Qué estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA · commit $GITHUB_SHA"

      - name: Bajar el código al runner
        uses: actions/checkout@v6

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4

      - name: Construir la etapa de tests del frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          target: test
          load: true
          push: false
          tags: frontend-test:ci
          cache-from: type=gha,scope=frontend-test
          cache-to: type=gha,mode=max,scope=frontend-test

      - name: Correr los tests del frontend con coverage
        run: |
          docker run --rm -e COVERAGE_DIR=/salida/reporte \
            -v "${{ github.workspace }}/frontend-coverage:/salida" frontend-test:ci

      - name: Resumen del coverage del frontend
        if: ${{ !cancelled() }}
        run: |
          F=frontend-coverage/reporte/coverage-summary.json
          test -f "$F"
          node -e "
            const t = require('./$F').total;
            if (!t.lines.total) { console.error('midio 0 archivos: revisar el include'); process.exit(1); }
            const f = (m) => \`| \${m} | \${t[m].pct}% | \${t[m].covered}/\${t[m].total} |\`;
            console.log('### Coverage del frontend');
            console.log('| métrica | % | cubierto |'); console.log('|---|---|---|');
            console.log(f('lines')); console.log(f('branches')); console.log(f('functions'));
          " >> $GITHUB_STEP_SUMMARY

      - name: Publicar el coverage del frontend
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: coverage-frontend
          path: frontend-coverage

      # ---- TP6: publicar, último paso del job (el porqué, en build-backend) ----
      - name: Entrar al registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # el token de la corrida: ningún secret nuevo

      - name: Construir y publicar la imagen del frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          # Las dos condiciones, no una: sólo un push a main publica. Si algún
          # día el disparador escucha otra rama, la garantía sigue acá.
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          # En minúsculas y a mano: el registry no acepta mayúsculas y
          # github.repository es «FranZago1/…». La etiqueta es el commit.
          tags: ghcr.io/franzago1/ingsoft3-tp01-frontend:sha-${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # ---- TP6: la promoción. CI verde → QA automático → aprobación → PROD ----
  deploy-qa:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]   # sin CI verde no hay deploy
    if: github.ref == 'refs/heads/main'      # los PRs verifican; sólo main despliega
    environment: qa                          # sus secrets (los hooks) y su historial; sin reviewers, a propósito
    concurrency: { group: deploy-qa, cancel-in-progress: false }
    steps:
      # 🔴 El `&ref=` es el corazón del práctico. Un hook pelado despliega la
      # PUNTA de la rama, no el commit que esta corrida verificó: con dos
      # merges seguidos, la corrida de A desplegaría B, que no pasó por nada.
      # La URL del hook ya trae `?key=…`, por eso va `&` y no `?`.
      - name: Disparar deploy en Render (api + front) — del commit verificado
        env:
          HOOK_API: ${{ secrets.RENDER_HOOK_API_QA }}
          HOOK_FRONT: ${{ secrets.RENDER_HOOK_FRONT_QA }}
        run: |
          curl -fsS --max-time 30 -o /dev/null "$HOOK_API&ref=$GITHUB_SHA"
          curl -fsS --max-time 30 -o /dev/null "$HOOK_FRONT&ref=$GITHUB_SHA"
          echo "Render va a construir $GITHUB_SHA en los dos servicios"

      # El hook contesta al instante y Render construye en background; mientras
      # tanto (o si ese build falla) sigue sirviendo la versión anterior. Por eso
      # el smoke no se conforma con un 200: exige que /api/health informe ESTE
      # commit. Reintenta porque el free tier duerme y el build tarda minutos.
      - name: Smoke test QA (espera a que corra este commit)
        shell: bash
        env:
          URL_API: ${{ vars.URL_API }}       # variables del environment: cada uno la suya
          URL_FRONT: ${{ vars.URL_FRONT }}
        run: |
          test -n "$URL_API" && test -n "$URL_FRONT" || { echo "❌ faltan URL_API / URL_FRONT en el environment"; exit 1; }
          for i in $(seq 1 45); do
            # --max-time en cada curl: un servicio despertando acepta la conexión
            # y no contesta; sin tope, el job moriría por el límite del runner.
            COMMIT=$(curl -fsS --max-time 10 "$URL_API/api/health" | jq -r .commit) || COMMIT=""
            if [ "$COMMIT" = "$GITHUB_SHA" ] \
               && curl -fsS --max-time 10 "$URL_API/api/health/db" \
               && curl -fsS --max-time 10 -o /dev/null "$URL_FRONT/login" \
               && curl -fsS --max-time 10 -o /dev/null "$URL_FRONT/api/health"; then
              echo; echo "✅ QA corre $GITHUB_SHA (api + base + front + front→api)"; exit 0
            fi
            echo "vuelta $i: la api informa '${COMMIT:-sin respuesta}', se espera $GITHUB_SHA"
            sleep 20
          done
          echo "❌ QA no quedó corriendo $GITHUB_SHA a tiempo"; exit 1

  deploy-prod:
    runs-on: ubuntu-latest
    needs: deploy-qa                         # PROD sólo después de QA vivo (y hereda su `if` de rama)
    environment: production                  # ⏸ acá la corrida SE PAUSA hasta el approve
    # Evita dos deploys a PROD pisándose. NO ordena la cola de aprobaciones:
    # una corrida vieja esperando review sobrevive, y aprobarla haría retroceder
    # PROD. Esa la rechazo a mano (ver decisiones.md).
    concurrency: { group: deploy-prod, cancel-in-progress: false }
    steps:
      # 🔴 El `&ref=` es el corazón del práctico. Un hook pelado despliega la
      # PUNTA de la rama, no el commit que esta corrida verificó. Y acá más que
      # en QA: entre que la corrida queda esperando y el approve pueden pasar
      # horas y main se mueve; sin el &ref, apruebo A y a PROD sube lo último.
      # La URL del hook ya trae `?key=…`, por eso va `&` y no `?`.
      - name: Disparar deploy en Render (api + front) — del commit aprobado
        env:
          HOOK_API: ${{ secrets.RENDER_HOOK_API_PROD }}
          HOOK_FRONT: ${{ secrets.RENDER_HOOK_FRONT_PROD }}
        run: |
          curl -fsS --max-time 30 -o /dev/null "$HOOK_API&ref=$GITHUB_SHA"
          curl -fsS --max-time 30 -o /dev/null "$HOOK_FRONT&ref=$GITHUB_SHA"
          echo "Render va a construir $GITHUB_SHA en los dos servicios"

      # El hook contesta al instante y Render construye en background; mientras
      # tanto (o si ese build falla) sigue sirviendo la versión anterior. Por eso
      # el smoke no se conforma con un 200: exige que /api/health informe ESTE
      # commit. Reintenta porque el free tier duerme y el build tarda minutos.
      - name: Smoke test PROD (espera a que corra este commit)
        shell: bash
        env:
          URL_API: ${{ vars.URL_API }}       # variables del environment: cada uno la suya
          URL_FRONT: ${{ vars.URL_FRONT }}
        run: |
          test -n "$URL_API" && test -n "$URL_FRONT" || { echo "❌ faltan URL_API / URL_FRONT en el environment"; exit 1; }
          for i in $(seq 1 45); do
            # --max-time en cada curl: un servicio despertando acepta la conexión
            # y no contesta; sin tope, el job moriría por el límite del runner.
            COMMIT=$(curl -fsS --max-time 10 "$URL_API/api/health" | jq -r .commit) || COMMIT=""
            if [ "$COMMIT" = "$GITHUB_SHA" ] \
               && curl -fsS --max-time 10 "$URL_API/api/health/db" \
               && curl -fsS --max-time 10 -o /dev/null "$URL_FRONT/login" \
               && curl -fsS --max-time 10 -o /dev/null "$URL_FRONT/api/health"; then
              echo; echo "✅ PROD corre $GITHUB_SHA (api + base + front + front→api)"; exit 0
            fi
            echo "vuelta $i: la api informa '${COMMIT:-sin respuesta}', se espera $GITHUB_SHA"
            sleep 20
          done
          echo "❌ PROD no quedó corriendo $GITHUB_SHA a tiempo"; exit 1
