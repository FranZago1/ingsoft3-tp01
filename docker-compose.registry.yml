# Mismo stack que docker-compose.yml, pero SIN construir nada: baja las
# imágenes ya publicadas en GitHub Container Registry.
#
#     cp .env.example .env     (y editar DB_PASSWORD / JWT_SECRET)
#     docker compose -f docker-compose.registry.yml up -d
#
# Es la diferencia entre "compilá el proyecto en tu máquina" y "corré la versión
# v0.1.0 que ya fue construida y probada". No hace falta tener el código fuente.
#
# Las imágenes se publican A MANO (el CI construye pero no pushea):
#     docker build -t ghcr.io/franzago1/reservapadel-backend:v0.1.0 ./backend
#     docker build -t ghcr.io/franzago1/reservapadel-frontend:v0.1.0 ./frontend
#     echo $GITHUB_TOKEN | docker login ghcr.io -u franzago1 --password-stdin
#     docker push ghcr.io/franzago1/reservapadel-backend:v0.1.0
#     docker push ghcr.io/franzago1/reservapadel-frontend:v0.1.0

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: padel
      POSTGRES_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD, copiá .env.example a .env}
      POSTGRES_DB: padel
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U padel -d padel"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    # Única diferencia con docker-compose.yml: image en vez de build.
    image: ghcr.io/franzago1/reservapadel-backend:v0.1.0
    environment:
      DATABASE_URL: "postgresql://padel:${DB_PASSWORD}@db:5432/padel?schema=public"
      JWT_SECRET: ${JWT_SECRET:?falta JWT_SECRET, copiá .env.example a .env}
      PORT: 8080
      NODE_ENV: production
      TZ: ${TZ:-America/Argentina/Cordoba}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: ghcr.io/franzago1/reservapadel-frontend:v0.1.0
    environment:
      BACKEND_URL: "http://backend:8080"
      NODE_ENV: production
      TZ: ${TZ:-America/Argentina/Cordoba}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db_data:
